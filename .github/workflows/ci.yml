name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # `lib/data/database.g.dart` is committed on purpose, so no codegen step
      # is needed here. See AGENTS.md — do not add a blanket `*.g.dart` ignore.
      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

  cpp:
    name: linux runner lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The C++ runner is checked by no Dart tool. `tool/cpp_lint.sh` derives
      # every flag from the real CMake files and needs GTK's headers present.
      - name: Install GTK headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev clang

      - name: Lint the Linux runner
        run: ./tool/cpp_lint.sh
